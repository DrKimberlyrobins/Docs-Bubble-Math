
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Doc's Bubble Math LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080e29;
  font-family: Arial, sans-serif;
  color: white;
}

#app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #080e29;
}

header {
  flex: 0 0 auto;
  padding: 8px 4px 5px;
  text-align: center;
  background: #080e29;
}

h1 {
  color: #ffe785;
  font-size: clamp(16px, 4.4vw, 27px);
  margin: 3px 0;
}

.subtitle {
  font-size: clamp(10px, 2.7vw, 15px);
  margin: 5px 0;
  color: #d7dfff;
}

#timer {
  font-size: clamp(23px, 6vw, 36px);
  color: #ffe785;
  font-weight: bold;
  margin: 5px 0;
  font-variant-numeric: tabular-nums;
}

#score {
  font-size: clamp(13px, 3.5vw, 18px);
  font-weight: bold;
  margin: 5px 0;
}

#game {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  border: 2px solid #5974c7;
  border-radius: 12px;
  background:
    radial-gradient(
      ellipse at 25% 20%,
      #294887,
      transparent 55%
    ),
    radial-gradient(
      ellipse at 80% 75%,
      #43236e,
      transparent 60%
    ),
    #080e29;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

footer {
  flex: 0 0 auto;
  padding: 8px 4px;
  text-align: center;
  background: #080e29;
  color: #d7dfff;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="app">

<header>
  <h1>ONLY QUICK THINKERS CAN WIN!</h1>

  <p class="subtitle">
    HOW MANY CAN YOU SOLVE BEFORE THEY DISAPPEAR?
  </p>

  <p class="subtitle">
    x = 2, y = 4, z = 5, a = 1, b = 3
  </p>

  <div id="timer">00:00:00</div>

  <div id="score">
    MATCHES: 0 / 5
  </div>
</header>

<div id="game">
  <canvas id="canvas"></canvas>
</div>

<footer>
  PINK = QUESTIONS | BLUE = ANSWERS
</footer>

</div>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const game = document.getElementById("game");
const timer = document.getElementById("timer");
const score = document.getElementById("score");

const problems = [
  ["x(y + z)", "18"],
  ["z(b - a)", "10"],
  ["(x + z)(y + a)", "35"],
  ["y + b(z - x)", "13"],
  ["y + a(x + y) - b", "7"]
];

let W = 0;
let H = 0;
let bubbles = [];
let particles = [];

let matches = 0;
let gameNumber = 1;
let replayAt = null;
let lastTime = 0;

const startTime = performance.now();
const SPEED = 0.95;
const REPLAY_DELAY = 1200;

function resize() {
  W = game.clientWidth;
  H = game.clientHeight;

  const dpr = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function radius(type) {
  const scale = Math.min(
    1,
    W / 390,
    H / 580
  );

  return type === "question"
    ? 49 * scale
    : 37 * scale;
}

function updateScore() {
  score.textContent =
    "MATCHES: " + matches +
    " / 5 | GAME: " + gameNumber;
}

function updateTimer(now) {
  const s = Math.floor(
    (now - startTime) / 1000
  );

  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;

  timer.textContent =
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0") + ":" +
    String(sec).padStart(2, "0");
}

// Find an empty starting location.
function findPosition(r) {
  for (let i = 0; i < 1500; i++) {
    const x = r + Math.random() * (W - 2*r);
    const y = r + Math.random() * (H - 2*r);

    const clear = bubbles.every(b =>
      Math.hypot(x-b.x, y-b.y) >
      r+b.r+5
    );

    if (clear) return {x,y};
  }

  return null;
}

function startGame() {
  bubbles = [];
  matches = 0;
  replayAt = null;

  const items = [];

  problems.forEach((pair,id) => {
    items.push({
      id,
      type:"question",
      text:pair[0]
    });

    items.push({
      id,
      type:"answer",
      text:pair[1]
    });
  });

  // Randomize bubble positions.
  for(let i=items.length-1;i>0;i--) {
    const j=Math.floor(
      Math.random()*(i+1)
    );

    [items[i],items[j]] =
      [items[j],items[i]];
  }

  for(const b of items) {
    b.r=radius(b.type);

    let pos=findPosition(b.r);

    // Make bubbles slightly smaller only
    // if the browser window is overcrowded.
    while(!pos && b.r>20) {
      b.r*=0.94;
      pos=findPosition(b.r);
    }

    if(!pos) {
      // Place the bubble in the least
      // crowded sampled location.
      let bestGap=-Infinity;

      for(let k=0;k<500;k++) {
        const x=b.r+
          Math.random()*Math.max(0,W-2*b.r);
        const y=b.r+
          Math.random()*Math.max(0,H-2*b.r);

        const gap=bubbles.length
          ? Math.min(...bubbles.map(other =>
              Math.hypot(
                x-other.x,
                y-other.y
              )-b.r-other.r
            ))
          : 100;

        if(gap>bestGap) {
          bestGap=gap;
          pos={x,y};
        }
      }
    }

    b.x=pos.x;
    b.y=pos.y;

    const angle=Math.random()*Math.PI*2;

    b.vx=Math.cos(angle)*SPEED;
    b.vy=Math.sin(angle)*SPEED;
    b.active=true;

    bubbles.push(b);
  }

  updateScore();
}

function textLines(b) {
  if(
    b.type!=="question" ||
    b.text.length<=13
  ) {
    return [b.text];
  }

  const mid=Math.floor(b.text.length/2);
  let split=-1;

  for(let offset=0;offset<9;offset++) {
    for(const i of [
      mid-offset,
      mid+offset
    ]) {
      if(
        i>0 &&
        i<b.text.length-1 &&
        "+-".includes(b.text[i])
      ) {
        split=i;
        break;
      }
    }

    if(split!==-1) break;
  }

  if(split===-1) return [b.text];

  return [
    b.text.slice(0,split).trim(),
    b.text.slice(split).trim()
  ];
}

function drawBubble(b) {
  const question=b.type==="question";

  const g=ctx.createRadialGradient(
    b.x-b.r*.3,
    b.y-b.r*.35,
    2,
    b.x,
    b.y,
    b.r
  );

  if(question) {
    g.addColorStop(0,"#ffe1f5");
    g.addColorStop(.65,"#e67bc6");
    g.addColorStop(1,"#9b348f");
  } else {
    g.addColorStop(0,"#e0fcff");
    g.addColorStop(.65,"#64d5fa");
    g.addColorStop(1,"#2372c6");
  }

  ctx.save();

  ctx.shadowColor=
    question?"#ff75d5":"#54dbff";

  ctx.shadowBlur=17;

  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.lineWidth=2;
  ctx.strokeStyle="rgba(255,255,255,.85)";
  ctx.stroke();

  // Glossy highlight.
  ctx.beginPath();
  ctx.ellipse(
    b.x-b.r*.28,
    b.y-b.r*.4,
    b.r*.23,
    b.r*.12,
    -.6,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.fill();

  const lines=textLines(b);

  let size=question?16:24;

  ctx.font=`bold ${size}px Arial`;

  while(
    size>8 &&
    lines.some(line =>
      ctx.measureText(line).width>b.r*1.8
    )
  ) {
    size--;
    ctx.font=`bold ${size}px Arial`;
  }

  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#111c43";

  const lineHeight=size*1.2;
  const top=
    b.y-(lines.length-1)*lineHeight/2;

  lines.forEach((line,i) => {
    ctx.fillText(
      line,
      b.x,
      top+i*lineHeight,
      b.r*1.85
    );
  });

  ctx.restore();
}

function explode(x,y) {
  const colors=[
    "#ffe785",
    "#ff66cc",
    "#64d5fa",
    "#ffffff",
    "#9dff9a",
    "#ff9b59"
  ];

  for(let i=0;i<130;i++) {
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*7;

    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:55+Math.random()*30,
      size:2+Math.random()*5,
      color:colors[
        Math.floor(Math.random()*colors.length)
      ]
    });
  }
}

function drawParticles(dt) {
  for(const p of particles) {
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=Math.pow(.98,dt);
    p.vy*=Math.pow(.98,dt);

    p.life-=dt;

    if(p.life<=0) continue;

    ctx.save();
    ctx.globalAlpha=Math.min(1,p.life/25);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=12;

    ctx.beginPath();
    ctx.arc(
      p.x,p.y,p.size,
      0,Math.PI*2
    );
    ctx.fill();

    ctx.restore();
  }

  particles=particles.filter(
    p=>p.life>0
  );
}

function keepInside(b) {
  if(b.x<b.r) {
    b.x=b.r;
    b.vx=Math.abs(b.vx);
  }

  if(b.x>W-b.r) {
    b.x=W-b.r;
    b.vx=-Math.abs(b.vx);
  }

  if(b.y<b.r) {
    b.y=b.r;
    b.vy=Math.abs(b.vy);
  }

  if(b.y>H-b.r) {
    b.y=H-b.r;
    b.vy=-Math.abs(b.vy);
  }
}

function move(dt,now) {
  const active=bubbles.filter(
    b=>b.active
  );

  for(const b of active) {
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    keepInside(b);
  }

  for(let i=0;i<active.length;i++) {
    for(let j=i+1;j<active.length;j++) {
      const a=active[i];
      const b=active[j];

      if(!a.active || !b.active) continue;

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let dist=Math.hypot(dx,dy);

      if(dist<.001) {
        const angle=Math.random()*Math.PI*2;
        dx=Math.cos(angle);
        dy=Math.sin(angle);
        dist=1;
      }

      const minimum=a.r+b.r;

      if(dist>=minimum) continue;

      // Correct answers explode immediately.
      const correct=
        a.id===b.id &&
        a.type!==b.type;

      if(correct) {
        a.active=false;
        b.active=false;

        explode(
          (a.x+b.x)/2,
          (a.y+b.y)/2
        );

        matches++;
        updateScore();

        if(matches===problems.length) {
          replayAt=now+REPLAY_DELAY;
        }

        continue;
      }

      // Incorrect bubbles bounce.
      const nx=dx/dist;
      const ny=dy/dist;
      const overlap=minimum-dist;

      a.x-=nx*overlap/2;
      a.y-=ny*overlap/2;

      b.x+=nx*overlap/2;
      b.y+=ny*overlap/2;

      const relative=
        (b.vx-a.vx)*nx+
        (b.vy-a.vy)*ny;

      if(relative<0) {
        a.vx+=relative*nx;
        a.vy+=relative*ny;

        b.vx-=relative*nx;
        b.vy-=relative*ny;
      }

      keepInside(a);
      keepInside(b);
    }
  }
}

function animate(now) {
  const dt=Math.min(
    (now-(lastTime||now))/16.67,
    2
  );

  lastTime=now;

  ctx.clearRect(0,0,W,H);

  updateTimer(now);

  move(dt,now);

  for(const b of bubbles) {
    if(b.active) drawBubble(b);
  }

  drawParticles(dt);

  // Endless automatic replay.
  if(replayAt!==null && now>=replayAt) {
    gameNumber++;
    startGame();
  }

  requestAnimationFrame(animate);
}

resize();
startGame();
requestAnimationFrame(animate);

// Handle TikTok browser-source resizing.
const observer=new ResizeObserver(() => {
  const oldW=W;
  const oldH=H;

  resize();

  if(
    Math.abs(W-oldW)>1 ||
    Math.abs(H-oldH)>1
  ) {
    // Keep the existing game running
    // while adapting to new dimensions.
    for(const b of bubbles) {
      b.x*=W/Math.max(1,oldW);
      b.y*=H/Math.max(1,oldH);
      keepInside(b);
    }
  }
});

observer.observe(game);

</script>
</body>
</html>
