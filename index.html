
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc's Bubble Math Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080e29;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #ffe785;
  font-size: clamp(19px, 5vw, 27px);
  margin: 8px 0 4px;
}

.subtitle {
  color: #d7dfff;
  font-size: 13px;
  margin: 5px;
}

#timer {
  font-size: 29px;
  font-weight: bold;
  color: #ffe785;
  margin: 7px;
  font-variant-numeric: tabular-nums;
}

#score {
  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  margin: 7px;
}

#game {
  position: relative;
  width: min(100%, 450px);
  height: 76dvh;
  min-height: 650px;
  max-height: 850px;
  margin: auto;
  overflow: hidden;
  border: 2px solid #5974c7;
  border-radius: 16px;
  background:
    radial-gradient(
      ellipse at 25% 20%,
      #294887,
      transparent 55%
    ),
    radial-gradient(
      ellipse at 80% 75%,
      #43236e,
      transparent 60%
    ),
    #080e29;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.legend {
  color: #d7dfff;
  font-size: 13px;
  padding: 8px;
}

button {
  background: #ffe785;
  color: #111c43;
  border: none;
  border-radius: 22px;
  padding: 10px 25px;
  font-size: 15px;
  font-weight: bold;
  margin: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>ONLY QUICK THINKERS CAN WIN!</h1>

<p class="subtitle">
  HOW MANY CAN YOU SOLVE BEFORE THEY DISAPPEAR?
</p>

<p class="subtitle">
  x = 2, y = 4, z = 5, a = 1, b = 3
</p>

<div id="timer">00:00:00</div>

<div id="score">MATCHES: 0 / 5</div>

<div id="game">
  <canvas id="canvas"></canvas>
</div>

<div class="legend">
  PINK = QUESTIONS | BLUE = ANSWERS
</div>

<button onclick="restart()">RESTART GAME</button>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const game = document.getElementById("game");
const score = document.getElementById("score");
const timer = document.getElementById("timer");

// Original worksheet: questions 1 through 5.
const problems = [
  ["x(y + z)", "18"],
  ["z(b - a)", "10"],
  ["(x + z)(y + a)", "35"],
  ["y + b(z - x)", "13"],
  ["y + a(x + y) - b", "7"]
];

let W = 0;
let H = 0;

let bubbles = [];
let particles = [];

let matches = 0;
let gamesPlayed = 0;
let nextGameAt = null;
let lastTime = 0;

// Continuous timer never resets during replay.
let timerStarted = performance.now();

// Bubble movement speed.
const SPEED = 1.0;

// Pause briefly after the final explosion.
const REPLAY_DELAY = 1000;

function resizeCanvas() {
  W = game.clientWidth;
  H = game.clientHeight;

  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Questions are bigger than answers.
function getRadius(type) {
  const scale = Math.min(1, W / 390);

  return type === "question"
    ? 49 * scale
    : 37 * scale;
}

function updateScore() {
  score.textContent =
    "MATCHES: " + matches + " / 5" +
    " | GAME: " + (gamesPlayed + 1);
}

function updateTimer(now) {
  const seconds = Math.floor(
    (now - timerStarted) / 1000
  );

  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor(
    (seconds % 3600) / 60
  );
  const secs = seconds % 60;

  timer.textContent =
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

// Randomize the starting positions.
// Never intentionally start two bubbles
// on top of each other.
function findPosition(r) {
  for (let attempt = 0; attempt < 2000; attempt++) {
    const x = r + Math.random() * (W - 2 * r);
    const y = r + Math.random() * (H - 2 * r);

    const available = bubbles.every(b => {
      const distance = Math.hypot(
        x - b.x,
        y - b.y
      );

      return distance > r + b.r + 5;
    });

    if (available) {
      return { x, y };
    }
  }

  return null;
}

function createGame() {
  bubbles = [];
  matches = 0;
  nextGameAt = null;

  const items = [];

  problems.forEach((pair, id) => {
    items.push({
      id: id,
      type: "question",
      text: pair[0]
    });

    items.push({
      id: id,
      type: "answer",
      text: pair[1]
    });
  });

  // Fisher-Yates shuffle.
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [items[i], items[j]] =
      [items[j], items[i]];
  }

  for (const item of items) {
    item.r = getRadius(item.type);

    let position = findPosition(item.r);

    // Adapt to unusually crowded screens.
    if (!position) {
      for (let attempt = 0; attempt < 5; attempt++) {
        item.r *= 0.9;
        position = findPosition(item.r);
        if (position) break;
      }
    }

    if (!position) {
      // Use the least crowded sampled position.
      let best = null;
      let bestGap = -Infinity;

      for (let k = 0; k < 500; k++) {
        const x = item.r +
          Math.random() * (W - 2 * item.r);

        const y = item.r +
          Math.random() * (H - 2 * item.r);

        const gap = bubbles.length
          ? Math.min(...bubbles.map(b =>
              Math.hypot(x - b.x, y - b.y)
              - b.r - item.r
            ))
          : 100;

        if (gap > bestGap) {
          bestGap = gap;
          best = { x, y };
        }
      }

      position = best;
    }

    item.x = position.x;
    item.y = position.y;

    const angle = Math.random() * Math.PI * 2;

    item.vx = Math.cos(angle) * SPEED;
    item.vy = Math.sin(angle) * SPEED;
    item.active = true;

    bubbles.push(item);
  }

  updateScore();
}

// Break longer expressions across lines.
function getTextLines(text, isQuestion) {
  if (!isQuestion || text.length <= 13) {
    return [text];
  }

  const mid = Math.floor(text.length / 2);
  let split = -1;

  for (let offset = 0; offset < 9; offset++) {
    for (const i of [
      mid - offset,
      mid + offset
    ]) {
      if (
        i > 0 &&
        i < text.length - 1 &&
        "+-".includes(text[i])
      ) {
        split = i;
        break;
      }
    }

    if (split !== -1) break;
  }

  if (split === -1) {
    return [text];
  }

  return [
    text.slice(0, split).trim(),
    text.slice(split).trim()
  ];
}

function drawText(b) {
  const question = b.type === "question";
  const lines = getTextLines(b.text, question);

  let fontSize = question ? 16 : 24;

  ctx.font = `bold ${fontSize}px Arial`;

  while (
    fontSize > 8 &&
    lines.some(line =>
      ctx.measureText(line).width > b.r * 1.8
    )
  ) {
    fontSize--;
    ctx.font = `bold ${fontSize}px Arial`;
  }

  ctx.fillStyle = "#111c43";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const lineHeight = fontSize * 1.2;

  const startY =
    b.y - (lines.length - 1) * lineHeight / 2;

  lines.forEach((line, index) => {
    ctx.fillText(
      line,
      b.x,
      startY + index * lineHeight,
      b.r * 1.85
    );
  });
}

function drawBubble(b) {
  const question = b.type === "question";

  const gradient = ctx.createRadialGradient(
    b.x - b.r * 0.3,
    b.y - b.r * 0.35,
    2,
    b.x,
    b.y,
    b.r
  );

  if (question) {
    gradient.addColorStop(0, "#ffe1f5");
    gradient.addColorStop(0.65, "#e67bc6");
    gradient.addColorStop(1, "#9b348f");
  } else {
    gradient.addColorStop(0, "#e0fcff");
    gradient.addColorStop(0.65, "#64d5fa");
    gradient.addColorStop(1, "#2372c6");
  }

  ctx.save();

  ctx.shadowColor =
    question ? "#ff75d5" : "#54dbff";

  ctx.shadowBlur = 17;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Bubble reflection.
  ctx.beginPath();
  ctx.ellipse(
    b.x - b.r * 0.28,
    b.y - b.r * 0.4,
    b.r * 0.23,
    b.r * 0.12,
    -0.6,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.fill();

  drawText(b);

  ctx.restore();
}

// Large colorful explosion.
function explode(x, y) {
  const colors = [
    "#ffe785",
    "#ff66cc",
    "#64d5fa",
    "#ffffff",
    "#9dff9a",
    "#ff9b59"
  ];

  for (let i = 0; i < 130; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 55 + Math.random() * 30,
      size: 2 + Math.random() * 5,
      color: colors[
        Math.floor(Math.random() * colors.length)
      ]
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.vx *= Math.pow(0.98, dt);
    p.vy *= Math.pow(0.98, dt);

    p.life -= dt;

    if (p.life <= 0) continue;

    ctx.save();

    ctx.globalAlpha = Math.min(
      1,
      p.life / 25
    );

    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
  }

  particles = particles.filter(
    p => p.life > 0
  );
}

// Keep every bubble inside the game.
function keepInside(b) {
  if (b.x < b.r) {
    b.x = b.r;
    b.vx = Math.abs(b.vx);
  }

  if (b.x > W - b.r) {
    b.x = W - b.r;
    b.vx = -Math.abs(b.vx);
  }

  if (b.y < b.r) {
    b.y = b.r;
    b.vy = Math.abs(b.vy);
  }

  if (b.y > H - b.r) {
    b.y = H - b.r;
    b.vy = -Math.abs(b.vy);
  }
}

function move(dt, now) {
  const active = bubbles.filter(
    b => b.active
  );

  // All bubbles move continuously.
  for (const b of active) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    keepInside(b);
  }

  // Detect all collisions.
  for (let i = 0; i < active.length; i++) {
    for (let j = i + 1; j < active.length; j++) {
      const a = active[i];
      const b = active[j];

      if (!a.active || !b.active) continue;

      let dx = b.x - a.x;
      let dy = b.y - a.y;
      let distance = Math.hypot(dx, dy);

      if (distance < 0.001) {
        const angle = Math.random() * Math.PI * 2;
        dx = Math.cos(angle);
        dy = Math.sin(angle);
        distance = 1;
      }

      const minimum = a.r + b.r;

      if (distance >= minimum) continue;

      // Every correct match explodes immediately.
      // There are NO delayed matches.
      const correct =
        a.id === b.id &&
        a.type !== b.type;

      if (correct) {
        a.active = false;
        b.active = false;

        explode(
          (a.x + b.x) / 2,
          (a.y + b.y) / 2
        );

        matches++;
        updateScore();

        // Automatically replay after match 5.
        if (matches === problems.length) {
          nextGameAt = now + REPLAY_DELAY;
        }

        continue;
      }

      // Incorrect pairs bounce apart.
      const nx = dx / distance;
      const ny = dy / distance;

      const overlap = minimum - distance;

      a.x -= nx * overlap / 2;
      a.y -= ny * overlap / 2;

      b.x += nx * overlap / 2;
      b.y += ny * overlap / 2;

      const relative =
        (b.vx - a.vx) * nx +
        (b.vy - a.vy) * ny;

      if (relative < 0) {
        a.vx += relative * nx;
        a.vy += relative * ny;

        b.vx -= relative * nx;
        b.vy -= relative * ny;
      }

      keepInside(a);
      keepInside(b);
    }
  }
}

function animate(now) {
  const dt = Math.min(
    (now - (lastTime || now)) / 16.67,
    2
  );

  lastTime = now;

  ctx.clearRect(0, 0, W, H);

  // Livestream timer never stops.
  updateTimer(now);

  move(dt, now);

  for (const b of bubbles) {
    if (b.active) {
      drawBubble(b);
    }
  }

  updateParticles(dt);

  // Endless replay of the SAME five problems.
  if (nextGameAt !== null && now >= nextGameAt) {
    gamesPlayed++;
    createGame();
  }

  requestAnimationFrame(animate);
}

// Manual restart does not reset live timer.
function restart() {
  gamesPlayed = 0;
  particles = [];
  createGame();
}

resizeCanvas();
createGame();
requestAnimationFrame(animate);

// Adjust dimensions if the browser changes size.
window.addEventListener("resize", () => {
  resizeCanvas();
  particles = [];
  createGame();
});

</script>
</body>
</html>
