
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc's Bubble Math Explosion</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080e29;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 {
  color: #ffe785;
  font-size: 25px;
  margin: 12px 0 5px;
}
.subtitle { font-size: 14px; color: #d7dfff; }
#score { color: #ffe785; font-weight: bold; margin: 9px; }
#game {
  width: min(100%, 560px);
  height: min(78dvh, 820px);
  min-height: 500px;
  margin: auto;
  overflow: hidden;
  border: 2px solid #5974c7;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 25% 20%, #294887, transparent 55%),
    radial-gradient(ellipse at 80% 75%, #43236e, transparent 60%),
    #080e29;
}
canvas { display: block; width: 100%; height: 100%; }
button {
  margin: 12px;
  padding: 11px 28px;
  background: #ffe785;
  color: #111c43;
  border: 0;
  border-radius: 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.legend { font-size: 13px; color: #d7dfff; }
</style>
</head>
<body>

<h1>DOC'S BUBBLE MATH</h1>
<p class="subtitle">x = 2, y = 4, z = 5, a = 1, b = 3</p>

<div id="liveTimer"
     style="font-size:30px;
            font-weight:bold;
            color:#ffe785;
            margin:10px;">
  00:00:00
</div>

<div id="score">ROUND 1</div>

<div id="game"><canvas id="canvas"></canvas></div>
<p class="legend">PINK = QUESTIONS | BLUE = ANSWERS</p>
<button onclick="restart()">RESTART</button>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const game = document.getElementById("game");
const score = document.getElementById("score");

// Questions and answers from our previous version.
const rounds = [
  [
    ["x(y + z)", "18"],
    ["z(b - a)", "10"],
    ["(x + z)(y + a)", "35"],
    ["y + b(z - x)", "13"],
    ["y + a(x + y) - b", "7"]
  ],
  [
    ["x(a + b + y + z)", "26"],
    ["z(y - x) + z(b - a)", "20"],
    ["[y + b(z - a)] / x", "8"],
    ["b[x(y - a) + z]", "33"],
    ["x(z + a) / b", "4"]
  ],
  [
    ["[y + b(a + a)] / xz", "1"]
  ]
];

// The first two pairs can pop immediately.
// The other three are released in stages.
const RELEASE_TIMES = [0, 0, 20, 40, 60];

let W, H;
let bubbles = [];
let particles = [];
let round = 0;
let matches = 0;
let total = 0;
let elapsed = 0;
let transition = 0;
let finished = false;
let lastTime = 0;

const SPEED = 0.95;

function resize() {
  W = game.clientWidth;
  H = game.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function getRadius(type) {
  const narrow = W < 410;
  return type === "question"
    ? (narrow ? 42 : 55)
    : (narrow ? 33 : 41);
}

function updateScore() {
  score.textContent =
    `ROUND ${round + 1} | MATCHES ${matches}/${rounds[round].length} | TOTAL ${total}/11`;
}

// Start bubbles without overlapping.
function findPosition(r) {
  for (let attempt = 0; attempt < 1000; attempt++) {
    const x = r + Math.random() * (W - 2*r);
    const y = r + Math.random() * (H - 2*r);

    const clear = bubbles.every(b =>
      Math.hypot(x-b.x, y-b.y) > r+b.r+7
    );

    if (clear) return {x,y};
  }
  return null;
}

function startRound() {
  bubbles = [];
  particles = [];
  matches = 0;
  elapsed = 0;
  transition = 0;

  const pairs = rounds[round];

  // Questions first, then answers, shuffled.
  const items = [];

  pairs.forEach((p,id) => {
    items.push({id,type:"question",text:p[0]});
    items.push({id,type:"answer",text:p[1]});
  });

  items.sort(() => Math.random()-0.5);

  for (const item of items) {
    item.r = getRadius(item.type);

    const pos = findPosition(item.r);

    if (pos) {
      item.x = pos.x;
      item.y = pos.y;
    } else {
      // Fallback for unusually small screens.
      item.r *= 0.85;
      const fallback = findPosition(item.r);
      item.x = fallback ? fallback.x : W/2;
      item.y = fallback ? fallback.y : H/2;
    }

    const angle = Math.random()*Math.PI*2;
    item.vx = Math.cos(angle)*SPEED;
    item.vy = Math.sin(angle)*SPEED;
    item.active = true;
    bubbles.push(item);
  }

  updateScore();
}

function drawText(b) {
  let lines = [b.text];

  if (b.type === "question" && b.text.length > 13) {
    const mid = Math.floor(b.text.length/2);
    let split = -1;

    for (let offset=0; offset<9; offset++) {
      for (const i of [mid-offset,mid+offset]) {
        if (
          i>0 && i<b.text.length-1 &&
          "+-".includes(b.text[i])
        ) {
          split=i;
          break;
        }
      }
      if(split!==-1) break;
    }

    if(split!==-1) {
      lines=[
        b.text.slice(0,split),
        b.text.slice(split)
      ];
    }
  }

  let size=b.type==="question" ? 16 : 24;

  ctx.font=`bold ${size}px Arial`;

  while(
    size>8 &&
    lines.some(line =>
      ctx.measureText(line).width>b.r*1.8
    )
  ) {
    size--;
    ctx.font=`bold ${size}px Arial`;
  }

  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#111c43";

  const height=size*1.2;
  const top=b.y-(lines.length-1)*height/2;

  lines.forEach((line,i) =>
    ctx.fillText(line,b.x,top+i*height)
  );
}

function drawBubble(b) {
  const question=b.type==="question";

  const g=ctx.createRadialGradient(
    b.x-b.r*.3,b.y-b.r*.35,2,
    b.x,b.y,b.r
  );

  if(question) {
    g.addColorStop(0,"#ffe1f5");
    g.addColorStop(.65,"#e67bc6");
    g.addColorStop(1,"#9b348f");
  } else {
    g.addColorStop(0,"#e0fcff");
    g.addColorStop(.65,"#64d5fa");
    g.addColorStop(1,"#2372c6");
  }

  ctx.save();
  ctx.shadowColor=question?"#ff75d5":"#54dbff";
  ctx.shadowBlur=17;

  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.lineWidth=2;
  ctx.strokeStyle="rgba(255,255,255,.85)";
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(
    b.x-b.r*.28,b.y-b.r*.4,
    b.r*.23,b.r*.12,-.6,0,Math.PI*2
  );
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.fill();

  drawText(b);
  ctx.restore();
}

function explode(x,y) {
  const colors=[
    "#ffe785","#ff66cc","#64d5fa",
    "#ffffff","#9dff9a","#ff9b59"
  ];

  for(let i=0;i<130;i++) {
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*7;

    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:55+Math.random()*30,
      size:2+Math.random()*5,
      color:colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

function updateParticles(dt) {
  for(const p of particles) {
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=Math.pow(.98,dt);
    p.vy*=Math.pow(.98,dt);
    p.life-=dt;

    if(p.life<=0) continue;

    ctx.save();
    ctx.globalAlpha=Math.min(1,p.life/25);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  particles=particles.filter(p=>p.life>0);
}

function move(dt) {
  const active=bubbles.filter(b=>b.active);

  for(const b of active) {
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    if(b.x<b.r) {
      b.x=b.r;
      b.vx=Math.abs(b.vx);
    }
    if(b.x>W-b.r) {
      b.x=W-b.r;
      b.vx=-Math.abs(b.vx);
    }
    if(b.y<b.r) {
      b.y=b.r;
      b.vy=Math.abs(b.vy);
    }
    if(b.y>H-b.r) {
      b.y=H-b.r;
      b.vy=-Math.abs(b.vy);
    }
  }

  for(let i=0;i<active.length;i++) {
    for(let j=i+1;j<active.length;j++) {
      const a=active[i];
      const b=active[j];

      if(!a.active || !b.active) continue;

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let dist=Math.hypot(dx,dy);

      if(dist===0) {
        dx=.01;
        dist=.01;
      }

      const min=a.r+b.r;
      if(dist>=min) continue;

      const nx=dx/dist;
      const ny=dy/dist;

      const correct=
        a.id===b.id &&
        a.type!==b.type;

      const release=RELEASE_TIMES[a.id]||0;

      if(correct && elapsed>=release) {
        a.active=false;
        b.active=false;

        explode((a.x+b.x)/2,(a.y+b.y)/2);

        matches++;
        total++;
        updateScore();

        if(matches===rounds[round].length) {
          transition=elapsed+2.5;
        }
        continue;
      }

      // Delayed correct pairs bounce apart
      // just like incorrect pairs.
      const overlap=min-dist;

      a.x-=nx*overlap/2;
      a.y-=ny*overlap/2;
      b.x+=nx*overlap/2;
      b.y+=ny*overlap/2;

      const relative=
        (b.vx-a.vx)*nx+
        (b.vy-a.vy)*ny;

      if(relative<0) {
        a.vx+=relative*nx;
        a.vy+=relative*ny;
        b.vx-=relative*nx;
        b.vy-=relative*ny;
      }

      // Keep positions within boundaries.
      for(const item of [a,b]) {
        item.x=Math.max(item.r,Math.min(W-item.r,item.x));
        item.y=Math.max(item.r,Math.min(H-item.r,item.y));
      }
    }
  }
}

function drawFinale() {
  ctx.save();
  ctx.fillStyle="rgba(8,14,41,.82)";
  ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="#ffe785";
  ctx.font="bold 30px Arial";
  ctx.fillText("YOU DID IT!",W/2,H/2-30);
  ctx.fillStyle="white";
  ctx.font="bold 21px Arial";
  ctx.fillText("11 MATCHES!",W/2,H/2+10);
  ctx.restore();
}

function animate(time) {
  const dt=Math.min(
    (time-(lastTime||time))/16.67,2
  );
  lastTime=time;

  ctx.clearRect(0,0,W,H);

  if(!finished) {
    elapsed+=dt/60;
    move(dt);

    for(const b of bubbles) {
      if(b.active) drawBubble(b);
    }
  }

  updateParticles(dt);

  if(transition && elapsed>=transition) {
    if(round<rounds.length-1) {
      round++;
      startRound();
    } else {
      finished=true;
      transition=0;
    }
  }

  if(finished) drawFinale();

  requestAnimationFrame(animate);
}

function restart() {
  round=0;
  total=0;
  finished=false;
  lastTime=0;
  startRound();
}

// CONTINUOUS LIVESTREAM TIMER
const liveTimer = document.getElementById("liveTimer");
const liveStart = Date.now();

function updateLiveTimer() {
  const seconds = Math.floor(
    (Date.now() - liveStart) / 1000
  );

  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  liveTimer.textContent =
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

updateLiveTimer();
setInterval(updateLiveTimer, 1000);

resize();
restart();
requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
  resize();
  restart();
});
</script>
</body>
</html>
